# Config for Pages CMS (https://app.pagescms.org) - mobile-friendly editor
media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
    fields:
      - name: layout
        type: string
        hidden: true
        default: post
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: categories
        label: Categories
        type: string
        list: true
      - name: body
        label: Content
        type: rich-text

  - name: about
    label: About page
    type: file
    path: about.md
    fields:
      - name: layout
        type: string
        hidden: true
        default: page
      - name: title
        type: string
      - name: permalink
        type: string
        hidden: true
        default: /about/
      - name: body
        label: Content
        type: rich-text
