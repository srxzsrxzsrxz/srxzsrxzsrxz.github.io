---
layout: default
title: Linux Man Documentation
permalink: /man/
---

<div class="site-container">
  <!-- Man Terminal Container -->
  <div class="man-container">
    <div class="terminal-titlebar">
      <div class="terminal-dots">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div class="terminal-sys-info">
        LINUX MAN-DB // 84 COMMANDS LOADED // REFERENCE MANUAL
      </div>
    </div>

    <!-- Search Controls -->
    <div class="man-search-bar">
      <span class="man-prompt">root@linux:~$ man</span>
      <input type="text" id="man-search-input" placeholder="Type command name (e.g. arecord, ffmpeg, yt-dlp, grep, curl, ssh)..." autocomplete="off" spellcheck="false">
      <button class="nav-btn" onclick="clearManSearch()">CLEAR</button>
    </div>

    <!-- Category Filter Tabs -->
    <div class="man-cat-tabs">
      <button class="man-cat-btn active" onclick="filterCategory('all', this)">ALL (<span id="cat-cnt-all">84</span>)</button>
      <button class="man-cat-btn" onclick="filterCategory('media', this)">AUDIO &amp; VIDEO</button>
      <button class="man-cat-btn" onclick="filterCategory('files', this)">FILES &amp; DISK</button>
      <button class="man-cat-btn" onclick="filterCategory('text', this)">TEXT &amp; GREP</button>
      <button class="man-cat-btn" onclick="filterCategory('network', this)">NETWORK &amp; WEB</button>
      <button class="man-cat-btn" onclick="filterCategory('system', this)">SYS &amp; PROC</button>
      <button class="man-cat-btn" onclick="filterCategory('dev', this)">DEV &amp; PKG</button>
    </div>

    <!-- Quick Pill Tags -->
    <div class="man-quick-chips" id="man-chips"></div>

    <!-- Man Page Display Box -->
    <div class="man-display-box" id="man-display">
      <div class="man-loading">Loading Linux manual database...</div>
    </div>
  </div>
</div>

<style>
  .man-container {
    margin: 25px 0 60px;
    background: #05070c;
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
    overflow: hidden;
  }
  .man-search-bar {
    padding: 14px 18px;
    background: #090d16;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .man-prompt {
    color: var(--hacker-green);
    font-weight: 700;
    font-size: 0.95rem;
    white-space: nowrap;
  }
  #man-search-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-family: var(--mono-font);
    font-size: 1rem;
    outline: none;
  }
  .man-cat-tabs {
    display: flex;
    background: #030408;
    border-bottom: 1px solid var(--border-color);
    overflow-x: auto;
    white-space: nowrap;
    padding: 2px 8px;
  }
  .man-cat-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--mono-font);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .man-cat-btn:hover {
    color: var(--text-primary);
  }
  .man-cat-btn.active {
    color: var(--hacker-green);
    border-bottom-color: var(--hacker-green);
    background: rgba(0, 255, 102, 0.05);
  }
  .man-quick-chips {
    padding: 12px 18px;
    background: #070912;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    max-height: 140px;
    overflow-y: auto;
  }
  .man-chip {
    background: rgba(0, 255, 102, 0.06);
    border: 1px solid var(--border-color);
    color: var(--hacker-green);
    font-size: 0.78rem;
    padding: 2px 9px;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--mono-font);
    transition: all 0.15s;
  }
  .man-chip:hover, .man-chip.active {
    background: var(--hacker-green);
    color: #000;
    font-weight: 700;
    box-shadow: 0 0 10px var(--hacker-glow);
  }
  .man-display-box {
    padding: 24px;
    min-height: 450px;
    max-height: 720px;
    overflow-y: auto;
    font-family: var(--mono-font);
    font-size: 0.92rem;
    line-height: 1.65;
    color: #f0fdf4;
    white-space: pre-wrap;
    background: #030408;
  }
  .man-header {
    color: var(--cyber-cyan);
    font-weight: 700;
    border-bottom: 1px dashed var(--border-color);
    padding-bottom: 8px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
  }
  .man-section-title {
    color: var(--hacker-green);
    font-weight: 800;
    font-size: 1rem;
    margin-top: 22px;
    margin-bottom: 6px;
    display: block;
    text-shadow: 0 0 8px var(--hacker-glow);
  }
  .man-option {
    color: var(--cyber-yellow);
    font-weight: 700;
  }
  .man-loading {
    color: var(--text-muted);
    text-align: center;
    padding: 60px 0;
  }
  .man-results-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .man-result-item {
    background: #090d16;
    border: 1px solid var(--border-color);
    padding: 12px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .man-result-item:hover {
    border-color: var(--hacker-green);
    transform: translateX(4px);
    box-shadow: 0 0 15px var(--hacker-glow);
  }
  .man-result-cmd {
    color: var(--hacker-green);
    font-weight: 800;
    font-size: 1.05rem;
    margin-bottom: 4px;
  }
  .man-result-desc {
    color: var(--text-secondary);
    font-size: 0.85rem;
  }
</style>

<script>
  let manDatabase = {};
  let currentCategory = 'all';
  const searchInput = document.getElementById('man-search-input');
  const chipsContainer = document.getElementById('man-chips');
  const displayBox = document.getElementById('man-display');

  const CATEGORIES = {
    media: ['arecord', 'aplay', 'amixer', 'alsamixer', 'ffmpeg', 'ffprobe', 'yt-dlp', 'mpv', 'pactl', 'pipewire', 'wireplumber', 'sox'],
    files: ['ls', 'cat', 'less', 'head', 'tail', 'cp', 'mv', 'rm', 'mkdir', 'rmdir', 'touch', 'ln', 'find', 'tree', 'file', 'stat', 'chmod', 'chown', 'df', 'du'],
    text: ['grep', 'sed', 'awk', 'cut', 'sort', 'uniq', 'wc', 'tr', 'diff', 'xargs', 'tee', 'echo'],
    network: ['curl', 'wget', 'ssh', 'scp', 'rsync', 'ping', 'ss', 'ip', 'nmap', 'dig', 'nc', 'tcpdump'],
    system: ['ps', 'top', 'htop', 'kill', 'pkill', 'free', 'uname', 'uptime', 'lsof', 'dmesg', 'journalctl', 'systemctl'],
    dev: ['git', 'gh', 'tar', 'gzip', 'zip', 'unzip', 'tmux', 'screen', 'crontab', 'watch', 'env', 'sudo', 'man', 'dnf', 'rpm', 'pip', 'pipx']
  };

  fetch('/assets/js/man_db.json')
    .then(r => r.json())
    .then(data => {
      manDatabase = data;
      document.getElementById('cat-cnt-all').textContent = Object.keys(manDatabase).length;
      renderChips();
      
      const params = new URLSearchParams(window.location.search);
      const cmdParam = params.get('cmd');
      if (cmdParam && manDatabase[cmdParam.toLowerCase()]) {
        renderManDoc(cmdParam.toLowerCase());
      } else {
        renderManDoc('arecord');
      }
    })
    .catch(err => {
      displayBox.innerHTML = '<div style="color:var(--danger)">Error loading Linux man database.</div>';
    });

  function filterCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.man-cat-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderChips();
  }

  function renderChips() {
    chipsContainer.innerHTML = '';
    const allKeys = Object.keys(manDatabase).sort();
    const filtered = currentCategory === 'all' 
      ? allKeys 
      : allKeys.filter(k => (CATEGORIES[currentCategory] || []).includes(k));

    filtered.forEach(k => {
      const chip = document.createElement('span');
      chip.className = 'man-chip' + (searchInput.value.trim().toLowerCase() === k ? ' active' : '');
      chip.textContent = k;
      chip.onclick = () => renderManDoc(k);
      chipsContainer.appendChild(chip);
    });
  }

  function renderManDoc(cmd) {
    searchInput.value = cmd;
    
    document.querySelectorAll('.man-chip').forEach(c => {
      c.classList.toggle('active', c.textContent === cmd);
    });

    const item = manDatabase[cmd];
    if (!item) {
      displayBox.innerHTML = `<div style="color:#ef4444;">No manual entry for ${cmd}</div>`;
      return;
    }

    let raw = item.doc;
    raw = raw.replace(/^[A-Z][A-Z\s]{2,}$/gm, m => `<span class="man-section-title">${m}</span>`);
    raw = raw.replace(/(^\s+-[a-zA-Z0-9_\-]+(?:,\s+--[a-zA-Z0-9_\-]+)?)/gm, m => `<span class="man-option">${m}</span>`);

    displayBox.innerHTML = `
      <div class="man-header">
        <span>${cmd.toUpperCase()}(1)</span>
        <span>Linux User's Manual</span>
        <span>${cmd.toUpperCase()}(1)</span>
      </div>
      <div>${raw}</div>
    `;
    displayBox.scrollTop = 0;
  }

  searchInput.addEventListener('input', (e) => {
    let q = e.target.value.trim().toLowerCase();
    if (q.startsWith('man ')) q = q.replace(/^man\s+/, '').trim();
    if (!q) {
      renderManDoc('arecord');
      return;
    }

    if (manDatabase[q]) {
      renderManDoc(q);
      return;
    }

    const matches = Object.keys(manDatabase).filter(k => 
      k.includes(q) || (manDatabase[k].summary && manDatabase[k].summary.toLowerCase().includes(q))
    );

    if (matches.length === 0) {
      displayBox.innerHTML = `<div style="color:var(--text-muted); padding:40px 0; text-align:center;">No manual entry matching "${q}"</div>`;
      return;
    }

    displayBox.innerHTML = '<div class="man-results-list">' + matches.map(k => `
      <div class="man-result-item" onclick="renderManDoc('${k}')">
        <div class="man-result-cmd">${k}(1) &rarr;</div>
        <div class="man-result-desc">${manDatabase[k].summary || 'Linux manual documentation'}</div>
      </div>
    `).join('') + '</div>';
  });

  function clearManSearch() {
    searchInput.value = '';
    renderManDoc('arecord');
    searchInput.focus();
  }
</script>
