---
layout: default
title: Linux Command Manual
permalink: /man/
---

<div class="site-container">
  <div class="man-app-wrapper">
    <!-- Top Bar -->
    <div class="man-top-header">
      <div class="man-header-meta">
        <span class="man-logo-icon">🐧</span>
        <div>
          <h1 class="man-main-title">Linux Command Reference</h1>
          <p class="man-subtitle">Interactive Cheatsheet &bull; 84 Commands</p>
        </div>
      </div>
      <div class="view-switch-btns">
        <button class="view-btn active" id="view-clean-btn" onclick="setViewMode('clean')">✨ Clean</button>
        <button class="view-btn" id="view-raw-btn" onclick="setViewMode('raw')">📜 Terminal</button>
      </div>
    </div>

    <!-- Search Input -->
    <div class="man-search-card">
      <span class="search-cli-prompt">&gt; man</span>
      <input type="text" id="man-search-input" placeholder="Search 84 commands (e.g. arecord, grep, ffmpeg, curl)..." autocomplete="off" spellcheck="false">
      <button class="search-clear-btn" id="search-clear-btn" onclick="clearSearch()" title="Clear">✕</button>
    </div>

    <!-- Category Filter Carousel (Swipeable on mobile) -->
    <div class="man-cat-carousel">
      <button class="cat-pill active" onclick="selectCategory('all', this)">✨ All (84)</button>
      <button class="cat-pill" onclick="selectCategory('media', this)">🎥 Media</button>
      <button class="cat-pill" onclick="selectCategory('files', this)">📁 Files</button>
      <button class="cat-pill" onclick="selectCategory('text', this)">🔍 Text</button>
      <button class="cat-pill" onclick="selectCategory('network', this)">🌐 Network</button>
      <button class="cat-pill" onclick="selectCategory('system', this)">⚙️ System</button>
      <button class="cat-pill" onclick="selectCategory('dev', this)">🛠️ Dev/Git</button>
    </div>

    <!-- Command Quick Selector (Swipeable Pills) -->
    <div class="command-pills-bar" id="command-pills-bar">
      <!-- Injected via JS -->
    </div>

    <!-- Main Command Content Display Card -->
    <div class="man-content-card" id="man-content-card">
      <div class="man-loading-state">
        <div class="pulse-icon">🐧</div>
        <div>Loading command database...</div>
      </div>
    </div>
  </div>
</div>

<style>
  :root {
    --man-card-bg: rgba(14, 19, 32, 0.92);
    --man-border: rgba(74, 222, 128, 0.2);
    --man-code-bg: #03050a;
  }

  .man-app-wrapper {
    margin: 20px 0 60px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Header */
  .man-top-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--man-card-bg);
    border: 1px solid var(--man-border);
    border-radius: 14px;
    backdrop-filter: blur(12px);
  }

  .man-header-meta {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .man-logo-icon {
    font-size: 1.8rem;
    background: rgba(0, 255, 102, 0.08);
    border: 1px solid var(--man-border);
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
  }

  .man-main-title {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--hacker-green);
    margin: 0;
  }

  .man-subtitle {
    font-size: 0.76rem;
    color: var(--text-muted);
    margin: 0;
  }

  .view-switch-btns {
    display: flex;
    gap: 4px;
    background: #020408;
    padding: 3px;
    border-radius: 8px;
    border: 1px solid var(--man-border);
  }

  .view-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.74rem;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
  }

  .view-btn.active {
    background: var(--hacker-green);
    color: #000;
    font-weight: 800;
  }

  /* Search Card */
  .man-search-card {
    display: flex;
    align-items: center;
    background: var(--man-card-bg);
    border: 1px solid var(--man-border);
    border-radius: 12px;
    padding: 10px 14px;
    gap: 10px;
    transition: all 0.2s;
  }

  .man-search-card:focus-within {
    border-color: var(--hacker-green);
    box-shadow: 0 0 15px var(--hacker-glow);
  }

  .search-cli-prompt {
    color: var(--hacker-green);
    font-weight: 800;
    font-size: 0.92rem;
  }

  #man-search-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
  }

  .search-clear-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 4px;
  }

  /* Category Carousel */
  .man-cat-carousel {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    white-space: nowrap;
    padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .man-cat-carousel::-webkit-scrollbar {
    display: none;
  }

  .cat-pill {
    background: #090d16;
    border: 1px solid var(--man-border);
    color: var(--text-secondary);
    padding: 7px 14px;
    border-radius: 20px;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .cat-pill.active {
    background: var(--hacker-green);
    color: #000;
    border-color: var(--hacker-green);
    box-shadow: 0 0 10px var(--hacker-glow);
  }

  /* Command Selection Bar (Clean swipe list) */
  .command-pills-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    white-space: nowrap;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .command-pills-bar::-webkit-scrollbar {
    display: none;
  }

  .cmd-pill {
    background: rgba(0, 255, 102, 0.05);
    border: 1px solid var(--man-border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .cmd-pill.active {
    background: rgba(0, 255, 102, 0.2);
    border-color: var(--hacker-green);
    color: var(--hacker-green);
    font-weight: 700;
  }

  /* Main Document Card */
  .man-content-card {
    background: var(--man-card-bg);
    border: 1px solid var(--man-border);
    border-radius: 16px;
    padding: 24px 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    min-height: 400px;
  }

  /* Clean Document Formatting */
  .cmd-hero-box {
    border-bottom: 1px solid var(--man-border);
    padding-bottom: 20px;
    margin-bottom: 22px;
  }

  .cmd-hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .cmd-title-large {
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--hacker-green);
    margin: 0;
    line-height: 1.2;
    text-shadow: 0 0 15px var(--hacker-glow);
  }

  .cmd-badge {
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--cyber-cyan);
    font-size: 0.72rem;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .cmd-summary-text {
    font-size: 0.92rem;
    color: var(--text-secondary);
    margin-top: 10px;
    line-height: 1.5;
  }

  .doc-section {
    margin-bottom: 22px;
  }

  .doc-section-title {
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    color: var(--cyber-cyan);
    font-weight: 800;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .doc-section-title::before {
    content: "■";
    color: var(--hacker-green);
    font-size: 0.65rem;
  }

  .code-block-box {
    background: var(--man-code-bg);
    border: 1px solid var(--man-border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.88rem;
    color: #f0fdf4;
    overflow-x: auto;
    position: relative;
    line-height: 1.6;
    margin-top: 6px;
  }

  .copy-code-btn {
    position: absolute;
    right: 8px;
    top: 8px;
    background: #090d16;
    border: 1px solid var(--man-border);
    color: var(--text-muted);
    font-size: 0.72rem;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: 0.2s;
  }

  .copy-code-btn:hover {
    color: var(--hacker-green);
    border-color: var(--hacker-green);
  }

  .desc-paragraph {
    font-size: 0.92rem;
    line-height: 1.7;
    color: #cbd5e1;
    margin-bottom: 10px;
  }

  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .opt-card {
    background: #080c16;
    border: 1px solid var(--man-border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.86rem;
  }

  .opt-flag {
    color: var(--cyber-yellow);
    font-weight: 700;
    margin-bottom: 4px;
    display: block;
    word-break: break-all;
  }

  .opt-desc {
    color: var(--text-secondary);
    font-size: 0.82rem;
    line-height: 1.45;
  }

  /* Raw Terminal View */
  .raw-term-pre {
    background: #020306;
    border: 1px solid var(--man-border);
    padding: 16px;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 0.84rem;
    line-height: 1.6;
    color: var(--hacker-green);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .man-loading-state {
    text-align: center;
    padding: 60px 0;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .pulse-icon {
    font-size: 2.5rem;
    animation: float 2s infinite ease-in-out;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* Search Filter List when typing */
  .search-hits-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .search-hit-item {
    background: #080c16;
    border: 1px solid var(--man-border);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .search-hit-item:hover {
    border-color: var(--hacker-green);
    transform: translateX(3px);
    box-shadow: 0 0 10px var(--hacker-glow);
  }

  .search-hit-name {
    color: var(--hacker-green);
    font-weight: 800;
    font-size: 0.98rem;
    margin-bottom: 3px;
  }

  .search-hit-summary {
    color: var(--text-secondary);
    font-size: 0.82rem;
    line-height: 1.4;
  }

  @media (max-width: 600px) {
    .man-content-card {
      padding: 18px 14px;
    }
    .cmd-title-large {
      font-size: 1.5rem;
    }
  }
</style>

<script>
  let manDb = {};
  let currentCategory = 'all';
  let activeCommand = 'arecord';
  let viewMode = 'clean'; // 'clean' or 'raw'

  const searchInput = document.getElementById('man-search-input');
  const pillsBar = document.getElementById('command-pills-bar');
  const contentCard = document.getElementById('man-content-card');

  const CATEGORIES = {
    media: ['arecord', 'aplay', 'amixer', 'alsamixer', 'ffmpeg', 'ffprobe', 'yt-dlp', 'mpv', 'pactl', 'pipewire', 'wireplumber', 'sox'],
    files: ['ls', 'cat', 'less', 'head', 'tail', 'cp', 'mv', 'rm', 'mkdir', 'rmdir', 'touch', 'ln', 'find', 'tree', 'file', 'stat', 'chmod', 'chown', 'df', 'du'],
    text: ['grep', 'sed', 'awk', 'cut', 'sort', 'uniq', 'wc', 'tr', 'diff', 'xargs', 'tee', 'echo'],
    network: ['curl', 'wget', 'ssh', 'scp', 'rsync', 'ping', 'ss', 'ip', 'nmap', 'dig', 'nc', 'tcpdump'],
    system: ['ps', 'top', 'htop', 'kill', 'pkill', 'free', 'uname', 'uptime', 'lsof', 'dmesg', 'journalctl', 'systemctl'],
    dev: ['git', 'gh', 'tar', 'gzip', 'zip', 'unzip', 'tmux', 'screen', 'crontab', 'watch', 'env', 'sudo', 'man', 'dnf', 'rpm', 'pip', 'pipx']
  };

  // Fetch Database
  fetch('/assets/js/man_db.json')
    .then(r => r.json())
    .then(data => {
      manDb = data;
      renderCommandPills();

      const params = new URLSearchParams(window.location.search);
      const q = params.get('cmd');
      if (q && manDb[q.toLowerCase()]) {
        renderCommand(q.toLowerCase());
      } else {
        renderCommand('arecord');
      }
    })
    .catch(err => {
      contentCard.innerHTML = '<div style="color:var(--danger); text-align:center; padding:40px;">Error loading database.</div>';
    });

  function selectCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderCommandPills();
  }

  function renderCommandPills() {
    pillsBar.innerHTML = '';
    const keys = Object.keys(manDb).sort();
    const list = currentCategory === 'all' ? keys : keys.filter(k => (CATEGORIES[currentCategory] || []).includes(k));

    list.forEach(k => {
      const pill = document.createElement('button');
      pill.className = 'cmd-pill' + (k === activeCommand ? ' active' : '');
      pill.textContent = k;
      pill.onclick = () => renderCommand(k);
      pillsBar.appendChild(pill);
    });
  }

  function setViewMode(mode) {
    viewMode = mode;
    document.getElementById('view-clean-btn').classList.toggle('active', mode === 'clean');
    document.getElementById('view-raw-btn').classList.toggle('active', mode === 'raw');
    if (activeCommand && manDb[activeCommand]) {
      renderCommand(activeCommand);
    }
  }

  // Parse Man Page into Structured Sections
  function parseManDoc(raw) {
    const sections = {};
    let curSection = 'HEADER';
    sections[curSection] = [];

    const lines = raw.split('\\n');
    lines.forEach(line => {
      const trimmed = line.trim();
      if (/^[A-Z][A-Z\\s]{2,}$/.test(trimmed)) {
        curSection = trimmed;
        sections[curSection] = [];
      } else {
        sections[curSection].push(line);
      }
    });

    const synopsis = (sections['SYNOPSIS'] || []).join('\\n').trim();
    const desc = (sections['DESCRIPTION'] || []).join('\\n').trim();
    const optionsRaw = (sections['OPTIONS'] || []).join('\\n').trim();
    const examplesRaw = (sections['EXAMPLES'] || []).join('\\n').trim();

    // Extract options
    const options = [];
    if (optionsRaw) {
      const optBlocks = optionsRaw.split(/(?=\\n\\s{4,8}-[a-zA-Z0-9])/);
      optBlocks.slice(0, 8).forEach(block => {
        const blines = block.trim().split('\\n');
        if (blines.length > 0) {
          const flag = blines[0].trim();
          const explanation = blines.slice(1).join(' ').trim();
          if (flag.startsWith('-')) {
            options.push({ flag, explanation });
          }
        }
      });
    }

    return { synopsis, desc, options, examplesRaw };
  }

  function renderCommand(cmd) {
    activeCommand = cmd;
    searchInput.value = cmd;

    // Update Pills
    document.querySelectorAll('.cmd-pill').forEach(p => {
      const isCur = p.textContent === cmd;
      p.classList.toggle('active', isCur);
      if (isCur) p.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });

    const item = manDb[cmd];
    if (!item) {
      contentCard.innerHTML = `<div style="text-align:center; padding:40px; color:#ef4444;">No manual entry found for "${cmd}"</div>`;
      return;
    }

    if (viewMode === 'raw') {
      contentCard.innerHTML = `
        <div class="cmd-hero-box">
          <div class="cmd-hero-top">
            <h2 class="cmd-title-large">${cmd}(1)</h2>
            <span class="cmd-badge">RAW TERMINAL VIEW</span>
          </div>
        </div>
        <pre class="raw-term-pre">${item.doc}</pre>
      `;
      return;
    }

    // Clean Structured View
    const parsed = parseManDoc(item.doc);
    let html = `
      <div class="cmd-hero-box">
        <div class="cmd-hero-top">
          <h2 class="cmd-title-large">${cmd}</h2>
          <span class="cmd-badge">SECTION 1 // USER COMMANDS</span>
        </div>
        <p class="cmd-summary-text">${item.summary || 'Linux system command documentation'}</p>
      </div>
    `;

    // Synopsis Section
    if (parsed.synopsis) {
      html += `
        <div class="doc-section">
          <div class="doc-section-title">Synopsis / Syntax</div>
          <div class="code-block-box">
            <button class="copy-code-btn" onclick="copyText('${cmd}')">Copy</button>
            <code>${parsed.synopsis}</code>
          </div>
        </div>
      `;
    }

    // Description Section
    if (parsed.desc) {
      const paras = parsed.desc.split('\\n\\n').slice(0, 3);
      html += `
        <div class="doc-section">
          <div class="doc-section-title">Description</div>
          ${paras.map(p => `<p class="desc-paragraph">${p.trim()}</p>`).join('')}
        </div>
      `;
    }

    // Common Options Section
    if (parsed.options.length > 0) {
      html += `
        <div class="doc-section">
          <div class="doc-section-title">Essential Options &amp; Flags</div>
          <div class="options-grid">
            ${parsed.options.map(o => `
              <div class="opt-card">
                <span class="opt-flag">${o.flag}</span>
                <div class="opt-desc">${o.explanation || 'Option parameter description'}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Examples Section
    if (parsed.examplesRaw) {
      html += `
        <div class="doc-section">
          <div class="doc-section-title">Practical Examples</div>
          <div class="code-block-box">
            <code>${parsed.examplesRaw}</code>
          </div>
        </div>
      `;
    }

    contentCard.innerHTML = html;
  }

  // Live Search Listener
  searchInput.addEventListener('input', (e) => {
    let q = e.target.value.trim().toLowerCase();
    if (q.startsWith('man ')) q = q.replace(/^man\\s+/, '').trim();
    if (!q) {
      renderCommand('arecord');
      return;
    }

    // Exact Match
    if (manDb[q]) {
      renderCommand(q);
      return;
    }

    // Fuzzy List
    const keys = Object.keys(manDb);
    const hits = keys.filter(k => k.includes(q) || (manDb[k].summary && manDb[k].summary.toLowerCase().includes(q)));

    if (hits.length === 0) {
      contentCard.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">No manual commands matching "${q}"</div>`;
      return;
    }

    contentCard.innerHTML = `
      <div class="doc-section-title" style="margin-bottom:14px;">Matching Commands (${hits.length})</div>
      <div class="search-hits-list">
        ${hits.map(k => `
          <div class="search-hit-item" onclick="renderCommand('${k}')">
            <div class="search-hit-name">${k} &rarr;</div>
            <div class="search-hit-summary">${manDb[k].summary || 'Linux utility documentation'}</div>
          </div>
        `).join('')}
      </div>
    `;
  });

  function clearSearch() {
    searchInput.value = '';
    renderCommand('arecord');
    searchInput.focus();
  }

  function copyText(txt) {
    navigator.clipboard.writeText(txt).then(() => {
      alert(`Copied "${txt}" to clipboard!`);
    });
  }
</script>
