---
layout: default
---

<div class="site-container">
  <article class="article-wrapper">
    <header class="article-header">
      <h1 class="article-title">{{ page.title }}</h1>
      <div class="article-meta">
        <span>📅 {{ page.date | date: "%B %d, %Y" }}</span>
        {% if page.categories and page.categories.size > 0 %}
        <span>🏷️ {{ page.categories | join: ", " }}</span>
        {% endif %}
        <span>✍️ {{ page.author | default: site.author }}</span>
      </div>
    </header>

    <div class="article-content">
      {{ content }}
    </div>

    <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between;">
      <a href="{{ '/' | relative_url }}">&larr; Back to Home</a>
      <a href="https://github.com/{{ site.github_username }}/{{ site.github_username }}.github.io/edit/main/{{ page.path }}" target="_blank" rel="noopener">✏️ Edit this post</a>
    </div>
  </article>
</div>
