      <!-- Live Web Visit Counter Widget -->
      <div class="traffic-counter-box" title="Live Visitor Statistics">

        <span id="busuanzi_container_site_pv" class="traffic-item">
          <span style="color:var(--cyber-cyan); font-weight:700;">PV:</span>
          <span id="busuanzi_value_site_pv" class="counter-num">...</span>
        </span>
        <span style="color:var(--border-color);">&bull;</span>
        <span id="busuanzi_container_site_uv" class="traffic-item">

        </span>
      </div>
    </div>
  </div>
</footer>

<script>
  // Theme switcher logic
  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  
  function getPreferredTheme() {
    const saved = localStorage.getItem('theme');
    if (saved) return saved;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      if (themeIcon) themeIcon.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      if (themeIcon) themeIcon.textContent = '🌙';
    }
  }

  const currentTheme = getPreferredTheme();
  applyTheme(currentTheme);

  if (themeToggle) {
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const nextTheme = isDark ? 'light' : 'dark';
      localStorage.setItem('theme', nextTheme);
      applyTheme(nextTheme);
    });
  }
</script>
